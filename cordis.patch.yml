# 组合包层：向当前组合插入**基础扩展**（host 层）。
#
# 分层判据（详见 presets/README.md）：
# - **host 层（本文件）**：进程级 / 服务提供者 / 所有会话共享的行。
# - **agent plane（presets/*.patch.yml 的 plugins）**：会话级 / 工具裁剪 / 角色设定的行。
#
# 本文件的行：
# - redis-kv-store：Redis Provider，用 ctx.provide 提供 extKvStore 服务供其它插件消费。
#   服务提供者必须放 host 层 —— 放 preset 会变成每会话一份实例，webServer 路由还会重复注册。
# - internal-auth：内部网络无 token 鉴权 patch（包装进程级的 connection.requestRejection）。
# - mcp-test-plan：MCP 桥接，把**独立进程**的 server 的工具注册进全局层。
#   它必须与 preset 里的 tool-filter **分层** —— restriction 只过滤「继承来的」工具，同层就过滤不到。
#
# 在 presets/test-plan.patch.yml 里的（不在此文件）：persona、test-plan-tool-filter、
# test-plan-tool（章节生成工具 read_static_doc / write_chapter）。
#
# 方案数据由 MCP server 以**资源**形式提供：mcp-test-plan 行连上它，
# dsh-base 自带的 mcp-resources 行再把资源工具交给模型。本包不取数、不落盘方案 JSON。
#
# 用户可在自己 profile 的 cordis.patch.yml 中按 id 覆盖下面这些行来改配置——
# patch 会替换目标行的整个 config，因此要重述需要的每个键，而不是只写改动的那个。
- insert:
    # 基础扩展：ExtKvStore 定义层的 Redis Provider（RedisKvStore）。连接参数都在这一行，
    # 对外提供 extKvStore 服务（不感知业务；业务如何用它——键前缀、过期——在 test-plan-tool 行配置）。
    # 连接参数可用对应环境变量覆盖（REDIS_URL / REDIS_PASSWORD / REDIS_DB），
    # 环境变量优先于配置文件的显式字段。
    - id: redis-kv-store
      name: dsh-test-plan-tool/base-plugin/redis-kv-store
      config:
        # 是否启用并对外提供 extKvStore 服务；关闭时业务插件回退文件 sidecar。
        # 部署用 docker-compose 时经 REDIS_URL 环境变量指向 redis 容器，可略掉 url。
        enabled: true
        url: 'redis://127.0.0.1:6379'
        # 带密码时填这里，或设 REDIS_PASSWORD；未设则取 url 里 `:pass@` 的密码。
        password: ''
        # 库号（可选），或设 REDIS_DB。
        db: 0
        # 注入 webServer 的路由路径。
        webPath: '/api/redis-kv-store'

    # 基础扩展：内部网络无 token 鉴权 patch（包装 connection.requestRejection）。
    - id: internal-auth
      name: dsh-test-plan-tool/base-plugin/internal-auth

    # MCP 桥接：把**独立进程**的 MCP server 的工具注册进 ctx.tools。
    # 每台 server 一行；行 id 与 serverName 都叫 test-plan。地址可配置，默认指向本机 dev server。
    # 方案数据不在这里 —— 它由同一台 server 以**资源**形式提供，由 dsh-base 自带的
    # mcp-resources 行把 list_mcp_resources / read_mcp_resource 等交给模型。
    - id: mcp-test-plan
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: 'streamable-http'
        serverName: 'test-plan'                 # → 工具名 mcp__test-plan__<raw>
        url: !!js process.env.MCP_SERVER_URL ?? 'http://127.0.0.1:8096/mcp'
        headers: {}
        toolCallTimeoutMs: 60000
        # server 没起时不阻断 dsh 启动；模型仍能用只读资料与写章工具。
        failOnStartupError: false
        reconnect: { enabled: true, initialDelayMs: 500, maxDelayMs: 30000, maxAttempts: 10 }

    # 章节生成工具（test-plan-tool）**不在这里** —— 它注册的 read_static_doc / write_chapter
    # 只对 test-plan 预设的会话有意义，所以挂在 presets/test-plan.patch.yml 的 plugins 里
    # （agent plane），避免污染其它预设的工具列表。分层判据见 presets/README.md。

# Web 把 model-facing 工具挪到 agent preset。本层把默认预设改成 test-plan。
#
# 0.1.7 起旧的 `agent-presets` 行（带 includeShippedRoot / includeUserRoot / roots 目录扫描）
# 已被 `agent-preset-registry` 取代：注册表只认 config.default，不再扫描目录。
# 本包的 test-plan 预设声明见 presets/test-plan.patch.yml，随 dsh.bundle.patch 数组加载。
# patch 替换整份 config，因此把 schema 里会用到的键都写上。
- id: agent-preset-registry
  config:
    default: test-plan
