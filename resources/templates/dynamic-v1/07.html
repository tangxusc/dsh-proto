    <h1>07　分离面设计原则</h1>
    <p>本章按照操作分离面与数据分离面设计原则划分职责边界，确定由以下2个部门负责本次试验：</p>
    <h2>试验室</h2>
    <p>以设备供电输入和维护接口为操作分离面，负责设备状态确认、供电测量、受控上断电、BIT与告警检查及断电复查等操作类内容，统一控制上电窗口及异常断电。</p>
    <h2>系统联试组</h2>
    <p>以总线转接端口为数据分离面，负责总线监视、合法激励施加与交联数据判读，只进行无干扰监听和批准的地面激励。</p>
